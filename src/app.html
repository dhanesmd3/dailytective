<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2B1D14" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/ikon-180.png" />
		<script>
			// Terapkan pengaturan tampilan sebelum halaman digambar (lihat src/lib/client/pengaturan.svelte.ts)
			try {
				var p = JSON.parse(localStorage.getItem('dt_pengaturan') || '{}');
				if (p.kontrasTinggi) document.documentElement.setAttribute('data-kontras-tinggi', '');
				if (p.kurangiAnimasi) document.documentElement.setAttribute('data-kurangi-animasi', '');
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
